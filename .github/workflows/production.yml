# Déploiement continu de la branche main (production).
#
#   push sur main ─► contrôles (tests, types, lint)
#                     ├─► migrations D1 (link-db), si packages/db/migrations a changé
#                     │     └─► app (link-web-production) → qrcode.cg, automatique
#                     └─► routeur (link-router) → link.cg, s'il a changé, automatique
#
# Pousser sur main VAUT validation : pas d'étape manuelle ici (le passage par staging
# et beta.qrcode.cg sert de répétition). La base link-db est partagée avec la bêta :
# une migration est en général déjà appliquée depuis staging, et `apply` ne rejoue
# jamais une migration déjà suivie dans d1_migrations.
#
# Secret requis : CLOUDFLARE_API_TOKEN (Workers Scripts: Edit, D1: Edit, Workers
# Routes / Custom Domains sur qrcode.cg et link.cg, KV).

name: Production

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pas de file unique pour tout le workflow : un déploiement du routeur en attente
# d'approbation ne doit pas bloquer l'app. Chaque déploiement a sa propre file
# (voir les jobs) ; pour l'app, le dernier push l'emporte.

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: d173b721d701ab7804ac541a92709654

jobs:
  checks:
    name: Contrôles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Tests (tous les paquets)
        run: pnpm -r --if-present test
      - name: Types (app)
        run: pnpm --filter @link/web exec tsc --noEmit -p tsconfig.json
      - name: Lint (app)
        run: pnpm --filter @link/web lint

  changes:
    name: Qu'est-ce qui a changé ?
    runs-on: ubuntu-latest
    outputs:
      router: ${{ steps.filter.outputs.router }}
      migrations: ${{ steps.filter.outputs.migrations }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # Comparer au commit d'avant ce push (et non à la branche par défaut, qui
          # peut avoir des dizaines de commits de retard : tout paraîtrait modifié).
          base: ${{ github.ref_name }}
          filters: |
            router:
              - 'apps/router/**'
              - 'packages/shared/**'
            migrations:
              - 'packages/db/migrations/**'

  migrate:
    name: Migrations D1
    concurrency:
      group: production-migrate
      cancel-in-progress: false
    needs: [checks, changes]
    if: needs.changes.outputs.migrations == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Appliquer les migrations en attente
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm exec wrangler d1 migrations apply link-db --remote --env production

  deploy-web:
    name: App → qrcode.cg
    concurrency:
      group: production-web
      cancel-in-progress: true
    needs: [checks, migrate]
    # Part aussi quand il n'y avait pas de migration (job ignoré), jamais après un échec.
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    environment:
      name: qrcode.cg
      url: https://qrcode.cg
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build
        working-directory: apps/web
        run: pnpm exec opennextjs-cloudflare build
      - name: Déploiement
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm exec opennextjs-cloudflare deploy --env production
      - name: Vérification
        run: |
          for p in / /connexion /offres /creer; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://qrcode.cg$p")
            echo "$p → $code"
            [ "$code" = "200" ] || exit 1
          done

  deploy-router:
    name: Routeur → link.cg
    concurrency:
      group: production-router
      cancel-in-progress: false
    needs: [checks, changes]
    # Lancement manuel (Actions → Run workflow) : déploie le routeur même sans changement
    # dans ce push, par exemple après l'annulation d'un run précédent.
    if: needs.changes.outputs.router == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: link.cg
      url: https://link.cg
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Déploiement
        working-directory: apps/router
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm exec wrangler deploy
      - name: Vérification (un lien redirige toujours)
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' https://link.cg/demo)
          echo "link.cg/demo → $code"
          [ "$code" = "302" ] || exit 1
