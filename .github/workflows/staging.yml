# Déploiement continu de la branche staging.
#
#   push sur staging ─► contrôles (tests, types, lint)
#                        ├─► app (link-web)      → beta.qrcode.cg, automatique
#                        └─► routeur (link-router) → link.cg, seulement s'il a changé,
#                            APRÈS validation manuelle (environnement « link-router » :
#                            il sert toutes les adresses link.cg en production)
#
# Les migrations D1 restent manuelles (relues puis appliquées à part).
# Secret requis : CLOUDFLARE_API_TOKEN (déploiement des Workers).

name: Staging

on:
  push:
    branches: [staging]
  workflow_dispatch:

# Un déploiement à la fois ; le suivant attend au lieu d'annuler celui en cours.
concurrency:
  group: staging-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: d173b721d701ab7804ac541a92709654

jobs:
  checks:
    name: Contrôles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Tests (tous les paquets)
        run: pnpm -r --if-present test
      - name: Types (app)
        run: pnpm --filter @link/web exec tsc --noEmit -p tsconfig.json
      - name: Lint (app)
        run: pnpm --filter @link/web lint

  changes:
    name: Qu'est-ce qui a changé ?
    runs-on: ubuntu-latest
    outputs:
      router: ${{ steps.filter.outputs.router }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            router:
              - 'apps/router/**'
              - 'packages/shared/**'

  deploy-web:
    name: App → beta.qrcode.cg
    needs: checks
    runs-on: ubuntu-latest
    environment:
      name: beta
      url: https://beta.qrcode.cg
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build
        working-directory: apps/web
        run: pnpm exec opennextjs-cloudflare build
      - name: Déploiement
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm exec opennextjs-cloudflare deploy
      - name: Vérification
        run: |
          for p in / /connexion /offres /creer; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://beta.qrcode.cg$p")
            echo "$p → $code"
            [ "$code" = "200" ] || exit 1
          done

  deploy-router:
    name: Routeur → link.cg (validation requise)
    needs: [checks, changes]
    if: needs.changes.outputs.router == 'true'
    runs-on: ubuntu-latest
    environment:
      name: link-router
      url: https://link.cg
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Déploiement
        working-directory: apps/router
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm exec wrangler deploy
      - name: Vérification (un lien redirige toujours)
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' https://link.cg/demo)
          echo "link.cg/demo → $code"
          [ "$code" = "302" ] || exit 1
