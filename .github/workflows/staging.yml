# Déploiement continu de la branche staging.
#
#   push sur staging ─► contrôles (tests, types, lint)
#                        ├─► migrations D1 (link-db), si packages/db/migrations a changé
#                        │     └─► app (link-web) → beta.qrcode.cg, automatique
#                        └─► routeur (link-router) → link.cg, seulement s'il a changé,
#                            APRÈS validation manuelle (environnement « link-router » :
#                            il sert toutes les adresses link.cg en production)
#
# Migrations : `wrangler d1 migrations apply`, suivi dans la table d1_migrations.
# ATTENTION : beta et production partagent la MÊME base link-db. Une migration poussée
# sur staging s'applique donc tout de suite à la production : elle doit rester
# compatible avec le code déjà en ligne (ajouter, pas renommer ni supprimer).
# Secret requis : CLOUDFLARE_API_TOKEN (Workers Scripts: Edit, D1: Edit, …).

name: Staging

on:
  push:
    branches: [staging]
  workflow_dispatch:

# Un déploiement à la fois ; le suivant attend au lieu d'annuler celui en cours.
# Pas de file unique pour tout le workflow : un déploiement du routeur en attente
# d'approbation ne doit pas bloquer l'app. Chaque déploiement a sa propre file
# (voir les jobs) ; pour l'app, le dernier push l'emporte.

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: d173b721d701ab7804ac541a92709654

jobs:
  checks:
    name: Contrôles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Tests (tous les paquets)
        run: pnpm -r --if-present test
      - name: Types (app)
        run: pnpm --filter @link/web exec tsc --noEmit -p tsconfig.json
      - name: Lint (app)
        run: pnpm --filter @link/web lint

  changes:
    name: Qu'est-ce qui a changé ?
    runs-on: ubuntu-latest
    outputs:
      router: ${{ steps.filter.outputs.router }}
      migrations: ${{ steps.filter.outputs.migrations }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # Comparer au commit d'avant ce push (et non à la branche par défaut, qui
          # peut avoir des dizaines de commits de retard : tout paraîtrait modifié).
          base: ${{ github.ref_name }}
          filters: |
            router:
              - 'apps/router/**'
              - 'packages/shared/**'
            migrations:
              - 'packages/db/migrations/**'

  migrate:
    name: Migrations D1
    concurrency:
      group: staging-migrate
      cancel-in-progress: false
    needs: [checks, changes]
    if: needs.changes.outputs.migrations == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Appliquer les migrations en attente
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm exec wrangler d1 migrations apply link-db --remote

  deploy-web:
    name: App → beta.qrcode.cg
    concurrency:
      group: staging-web
      cancel-in-progress: true
    needs: [checks, migrate]
    # Part aussi quand il n'y avait pas de migration (job ignoré), jamais après un échec.
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    environment:
      name: beta
      url: https://beta.qrcode.cg
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build
        working-directory: apps/web
        run: pnpm exec opennextjs-cloudflare build
      - name: Déploiement
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm exec opennextjs-cloudflare deploy
      - name: Vérification
        run: |
          for p in / /connexion /offres /creer; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://beta.qrcode.cg$p")
            echo "$p → $code"
            [ "$code" = "200" ] || exit 1
          done

  deploy-router:
    name: Routeur → link.cg (validation requise)
    concurrency:
      group: staging-router
      cancel-in-progress: false
    needs: [checks, changes]
    # Lancement manuel (Actions → Run workflow) : déploie le routeur même sans changement
    # dans ce push, par exemple après l'annulation d'un run précédent.
    if: needs.changes.outputs.router == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: link-router
      url: https://link.cg
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Déploiement
        working-directory: apps/router
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm exec wrangler deploy
      - name: Vérification (un lien redirige toujours)
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' https://link.cg/demo)
          echo "link.cg/demo → $code"
          [ "$code" = "302" ] || exit 1
